[project]
name = "industrial-fault-detection-50"
version = "0.1.0"
description = "Industrial fault detection with ML, served via FastAPI and Streamlit"
readme = "README.md"
authors = [
    { name = "VENKATRAM027", email = "nadarvenkatram@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "kagglehub>=1.0.2",
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "streamlit>=1.63.0",
    "tensorflow>=2.21.0",
    "tensorflow-keras>=0.1",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false
