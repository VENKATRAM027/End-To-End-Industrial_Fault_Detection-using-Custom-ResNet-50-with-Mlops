services:
  fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial_fault_api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      PYTHONPATH: /app/src
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
    restart: unless-stopped

  streamlit_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: industrial_fault_ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://fastapi_backend:8000/predict
    depends_on:
      - fastapi_backend
    command: >
      streamlit run ui/streamlit_ui.py
      --server.port 8501
      --server.address 0.0.0.0
    restart: unless-stopped
