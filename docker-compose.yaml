version: '3.8'

services:
  fastapi_backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mvtec_api
    ports:
      - "8000:8000"
    volumes:
      # Mount the local models folder so the API can read the latest trained weights
      - ./models:/app/models  
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  streamlit_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mvtec_ui
    ports:
      - "8501:8501"
    environment:
      
      - API_URL=http://fastapi_backend:8000/predict
    depends_on:
      - fastapi_backend
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped